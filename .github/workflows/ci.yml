name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libssl-dev libcrypt-dev libgtest-dev python3-requests
      - name: Configure
        run: cmake -S . -B build/ci -DSHUATI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/ci --parallel 2
      - name: Test
        run: ctest --test-dir build/ci --output-on-failure
      - name: Build judge image
        run: docker build -t shuati-cpp-judge:ci docker/cpp
      - name: Docker judge API smoke
        env:
          SHUATI_SERVER_BIN: ${{ github.workspace }}/build/ci/shuati_server
          SHUATI_TEST_RUNNER: docker
        run: |
          docker tag shuati-cpp-judge:ci shuati-cpp-judge:latest
          python3 scripts/api_smoke_p7.py
